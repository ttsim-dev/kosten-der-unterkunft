[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "kdu"
description = "Prototype choropleth maps of Germany at Gemeinde level"
readme = { file = "README.md", content-type = "text/markdown" }
keywords = []
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = []
[[project.authors]]
name = "Marvin Immesberger"
email = "immesberger@uni-bonn.de"

[tool.hatch]
build.hooks.vcs.version-file = "src/kdu/_version.py"
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]
metadata.allow-direct-references = true
version.source = "vcs"

[tool.pixi.dependencies]
gettsim = ">=1.3,<2"
nodejs = "*"
numpy = "*"
openpyxl = "*"
pandas = "*"
plotly = "*"
prek = "*"
python = "~=3.14.0"
python-kaleido = ">=1.3,<2"
pyarrow = ">=24.0.0,<25"
pytask = "*"
[tool.pixi.environments]
default = { features = [ "tests" ], solve-group = "default" }
[tool.pixi.feature.tests.pypi-dependencies]
pytest = "*"
pytest-cov = "*"
ty = "*"
[tool.pixi.feature.tests.tasks]
tests = "pytest"
tests-with-cov = "pytest --cov-report=xml --cov=./"
ty = "ty check"
[tool.pixi.pypi-dependencies]
kdu = { path = ".", editable = true }
pdbp = "*"
[tool.pixi.tasks]
# Refresh the committed inputs in `data/`. These reach the network and are run
# by hand when a new vintage appears; the pytask graph never calls them.
fetch-gemeinden = "python scripts/prepare_gemeinden.py"
fetch-gemeinde-population = "python scripts/fetch_gemeinde_population.py"
fetch-wohnkostenstatistik = "python scripts/fetch_ba_wohnkosten.py"
fetch-zensus-mieten = "python scripts/fetch_zensus_mieten.py"
pytask = "pytask"
view-pres = { cmd = "npx slidev documents/presentation.md", description = "View the presentation in the browser" }
# `--per-slide` renders one slide per browser page. Without it the deck's map
# renderings — three PNGs of a few megabytes each — are dropped from all but one
# slide, which then exports blank, heading included. The deck has no cross-slide
# links, which is the only thing `--per-slide` gives up.
export-pres = { cmd = "npx slidev export documents/presentation.md --output documents/presentation.pdf --per-slide", description = "Export the presentation to PDF" }
[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-64", "osx-arm64", "win-64" ]

[tool.ruff]
fix = true
unsafe-fixes = false
[tool.ruff.lint]
select = [ "ALL" ]
# Mathematical minus, multiplication sign and en dash are the correct characters
# in this project's docstrings, figure labels and table headers.
allowed-confusables = [ "−", "×", "–" ]
extend-ignore = [
  "COM812",  # Conflicts with ruff-format
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "FIX002",  # Line contains TODO
  "ISC001",  # Conflicts with ruff-format
  "PLR0913", # Too many arguments in function definition
  "S301",    # pickle module (standard intermediate format)
  # TC001-TC003: TYPE_CHECKING guards. Always ignore for Python 3.14+ projects
  # (PEP 649 deferred evaluation makes them unnecessary).
  "TC001",   # Move application import into a type-checking block
  "TC002",   # Move third-party import into a type-checking block
  "TC003",   # Move standard library import into a type-checking block
  "TRY003",  # Long messages outside exception class
]
per-file-ignores."scripts/*" = [
  "ANN401",  # Any (workbook cells are genuinely untyped)
  "DTZ011",  # date.today (a retrieval date is a local calendar date)
  "INP001",  # Implicit namespace package (scripts are run, not imported)
  "PD010",   # unstack over pivot_table (unstack raises on duplicated keys)
  "PD015",   # pd.merge over .merge
  "PERF401", # list comprehension over append
  "PLC0415", # Import outside top level (optional parsing dependencies)
  "PLR2004", # Magic value (HTTP status codes and column offsets)
  "S310",    # urllib open (these scripts exist to fetch over https)
  "T201",    # print (scripts report progress to stdout)
]
per-file-ignores."**/task_*.py" = [
  "B008", # Function call in argument default: pytask discovers dependencies this way
]
per-file-ignores."tests/*" = [
  "D",       # Docstrings
  "INP001",  # Implicit namespace packages
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert
]
pydocstyle.convention = "google"

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.14"
table_format = "long"
collapse_tables = [ "tool.hatch", "tool.pytest", "tool.ty" ]
expand_tables = [
  "tool.pixi.dependencies",
  "tool.pixi.environments",
  "tool.pixi.feature.tests.pypi-dependencies",
  "tool.pixi.feature.tests.tasks",
  "tool.pixi.pypi-dependencies",
  "tool.pixi.workspace",
]

[tool.ty]
# Promote all warn/ignore-default rules to error.
# Rules that default to error are omitted (already enforced).
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.ignore-comment-unknown-rule = "error"
rules.ineffective-final = "error"
rules.invalid-enum-member-annotation = "error"
rules.invalid-ignore-comment = "error"
rules.invalid-legacy-positional-parameter = "error"

[tool.pytest]
ini_options.addopts = [ "--pdbcls=pdbp:Pdb" ]
ini_options.filterwarnings = []

[tool.yamlfix]
line_length = 88
none_representation = "null"
sequence_style = "block_style"
